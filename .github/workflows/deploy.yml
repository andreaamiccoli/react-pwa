name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Permessi necessari per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
      
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Compila il progetto React
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v4

      - name: Carica gli asset compilati
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite compila il codice dentro la cartella dist

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
